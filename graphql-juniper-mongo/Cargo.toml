[package]
name = "graphql-juniper-mongo"
version = "0.1.0"
authors = ["Stivenson Rincón <stivenson.rpm@gmail.com>"]
edition = "2021"

[dependencies]
juniper = "0.16"
juniper_warp = "0.8"
mongodb = "2.8"
bson = "2.9"
serde = { version = "1", features = ["derive"] }
warp = "0.3"
serde_json = "1"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"